# ============================================================
# 数据库连接配置（被 com.score.util.DBUtil 读取）
# 这个文件会被打包进 WEB-INF/classes 下，修改后需要重新构建
#
# ⚠️ 安全提示：本文件包含数据库密码。
#    如果要上传到公开仓库（如 GitHub），请先把密码改成占位符，
#    否则任何人都能看到你的 MySQL 密码。
# ============================================================

# MySQL 8.x 的驱动类名（5.x 是 com.mysql.jdbc.Driver，8.x 必须加 .cj）
jdbc.driver=com.mysql.cj.jdbc.Driver

# 连接地址说明：
#   useUnicode + characterEncoding=UTF-8 : 防止中文姓名、科目名乱码（第二处乱码防护）
#   serverTimezone=Asia/Shanghai        : MySQL 8 必须给定时区，否则启动报错
#   useSSL=false                        : 本地开发关闭 SSL，避免握手警告
#   allowPublicKeyRetrieval=true        : MySQL 8 默认加密插件需要的参数
jdbc.url=jdbc:mysql://localhost:3306/score_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

# 数据库账号密码：已按本机 MySQL 实际账号填写
jdbc.username=root
jdbc.password=root123@
